<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>BOX launcher</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app" id="app">
      <div class="top-scrim" aria-hidden="true"></div>

      <header class="topbar">
        <div class="brand">BOX</div>

        <button class="icon-button" id="settingsButton" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3.1"></circle>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6h.09A1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v.09A1.7 1.7 0 0 0 20.96 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </header>

      <main class="hero">
        <div class="hero-content">
          <h1 class="version-title" id="versionTitle">Loading</h1>
          <p class="update-name" id="updateName">&nbsp;</p>

          <div class="actions">
            <button class="launch-button" id="launchButton" type="button">Launch</button>

            <div class="version-picker" id="versionPicker">
              <button class="version-button" id="versionButton" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Choose game version">
                <span id="versionLabel">26.2</span>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M6 9l6 6 6-6"></path>
                </svg>
              </button>
              <div class="version-menu" id="versionMenu" role="listbox" aria-label="Game version" hidden></div>
            </div>
          </div>

          <p class="status-text" id="statusText" role="status"></p>
        </div>
      </main>

      <section class="version-dock" aria-label="Versions">
        <div class="version-list" id="versionList"></div>
      </section>

      <div class="settings-panel" id="settingsPanel" hidden>
        <div class="settings-header">
          <span>Settings</span>
          <button class="settings-close" id="closeSettings" type="button" aria-label="Close settings">&times;</button>
        </div>

        <div class="settings-tabs" role="tablist" aria-label="Settings sections">
          <button class="settings-tab active" id="tabSettings" type="button" role="tab"
            aria-selected="true" aria-controls="settingsTabPanel">Settings</button>
          <button class="settings-tab" id="tabAccounts" type="button" role="tab"
            aria-selected="false" aria-controls="accountsTabPanel">Accounts</button>
        </div>

        <div class="settings-tab-panel" id="settingsTabPanel" role="tabpanel" aria-labelledby="tabSettings">
          <label class="setting-row slider-row">
            <span class="slider-head">
              <span>Minimum RAM</span>
              <span class="slider-value" id="minRamValue">1 GB</span>
            </span>
            <input id="settingMinRam" type="range" min="1" max="32" step="1" value="1">
          </label>

          <label class="setting-row slider-row">
            <span class="slider-head">
              <span>Maximum RAM</span>
              <span class="slider-value" id="maxRamValue">2 GB</span>
            </span>
            <input id="settingMaxRam" type="range" min="1" max="32" step="1" value="2">
          </label>

          <label class="setting-row slider-row">
            <span class="slider-head">
              <span>Resolution width</span>
              <span class="slider-value" id="widthValue">1280 px</span>
            </span>
            <input id="settingWidth" type="range" min="640" max="3840" step="10" value="1280">
          </label>

          <label class="setting-row slider-row">
            <span class="slider-head">
              <span>Resolution height</span>
              <span class="slider-value" id="heightValue">720 px</span>
            </span>
            <input id="settingHeight" type="range" min="360" max="2160" step="10" value="720">
          </label>

          <button class="settings-save" id="saveSettings" type="button">Save</button>
          <p class="settings-status" id="settingsStatus" role="status"></p>
        </div>

        <div class="settings-tab-panel" id="accountsTabPanel" role="tabpanel" aria-labelledby="tabAccounts" hidden>
          <div class="account-add">
            <input id="newAccountName" type="text" placeholder="Player name" autocomplete="off" spellcheck="false">
            <button id="addAccount" type="button">Add</button>
          </div>
          <div class="account-list" id="accountList"></div>
          <p class="settings-status" id="accountStatus" role="status"></p>
        </div>
      </div>

      <div class="drawer-scrim" id="drawerScrim"></div>
      <aside class="instance-drawer" id="instanceDrawer" aria-hidden="true" aria-label="Manage instances">
        <div class="drawer-header">
          <h2>Instances</h2>
          <button class="settings-close" id="closeDrawer" type="button" aria-label="Close instance drawer">&times;</button>
        </div>
        <p class="drawer-version" id="drawerVersion"></p>

        <button class="drawer-new" id="newInstanceButton" type="button">+ Create instance</button>

        <div class="instance-grid" id="drawerInstances"></div>
        <p class="drawer-status" id="drawerStatus" role="status"></p>
      </aside>

      <div class="install-popup" id="createPopup" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="install-popup-card">
          <div class="drawer-header">
            <h2>Create instance</h2>
            <button class="settings-close" id="closeCreatePopup" type="button" aria-label="Close">&times;</button>
          </div>

          <label class="drawer-field">
            <span>Version</span>
            <select id="instanceVersion"></select>
          </label>

          <label class="drawer-field">
            <span>Name</span>
            <input id="instanceName" type="text" autocomplete="off" spellcheck="false">
          </label>

          <label class="drawer-field">
            <span>Mod loader</span>
            <select id="instanceLoader"></select>
          </label>

          <label class="drawer-field">
            <span>Loader version</span>
            <input id="instanceLoaderVersion" type="text" autocomplete="off" spellcheck="false">
          </label>

          <button class="drawer-create" id="installInstance" type="button">Install</button>
          <p class="drawer-status" id="createStatus" role="status"></p>
        </div>
      </div>

      <div class="install-popup" id="installPopup" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="install-popup-card">
          <h2>Creating instance</h2>
          <p class="popup-name" id="installPopupName"></p>
          <div class="popup-progress">
            <div class="popup-progress-fill"></div>
          </div>
          <p class="popup-step" id="installPopupStep">Downloading libraries</p>
          <p class="popup-note">Keep BOX open while this finishes.</p>

          <div class="popup-guard" id="popupGuard" hidden>
            <p>Installation is still running. Closing won't cancel it.</p>
            <div class="cancel-guard-actions">
              <button id="popupKeep" type="button">Keep installing</button>
              <button id="popupCloseAnyway" type="button">Close anyway</button>
            </div>
          </div>
        </div>
      </div>

      <div class="install-popup crash-popup" id="crashPopup" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="crash-popup-card">
          <div class="drawer-header">
            <h2>Game crashed</h2>
            <button class="settings-close" id="closeCrashPopup" type="button" aria-label="Close">&times;</button>
          </div>

          <p class="crash-details" id="crashDetails"></p>
          <p class="crash-message" id="crashMessage"></p>

          <button class="crash-toggle" id="crashToggle" type="button"
            aria-expanded="false" aria-controls="crashLogs">
            <span class="crash-chevron" aria-hidden="true">&#9656;</span>
            <span id="crashToggleLabel">Show logs</span>
          </button>

          <pre class="crash-logs" id="crashLogs" hidden></pre>

          <button class="drawer-create crash-close" id="crashCloseButton" type="button">Close</button>
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
